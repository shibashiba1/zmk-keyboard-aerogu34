# v1.9: 全プロジェクトの revision（版）を固定した。
#   固定した版 = 2026-10-17 のビルド（GitHub Actions・成功）のとき、各ブランチの先端だったコミット。
#   目的 = 後からキーマップだけを直したり戻したりするとき、ほかの部品が変わらないようにする。
#   部品を新しくしたいときは、該当行の revision を、行末のコメントにあるブランチ名か
#   新しいコミットに書き換える。
#   2026-11-15 時点で、10-17 以降に更新があったのは zmk-feature-fast-keymap だけ
#   （ここでは 10-17 の版に固定）。
# v1.9.1: runtime-input-processor・fast-keymap・prospector-zmk-module の3つだけを、
#   2026-08-25 のビルド（Build #8＝v1.8。実機で動いている版）の時点の版に戻した。
#   理由 = v1.9（Build #11）を右手に書くと起動しなかったため。v1.8 と v1.9 で版が違う部品は
#   この3つだけ（各 repo の履歴で照合）。ほかの行と、キーマップ・overlay・conf は v1.9 のまま。
